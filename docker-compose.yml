services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: featurehub
      POSTGRES_PASSWORD: featurehub
      POSTGRES_DB: featurehub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: redis-server --requirepass featurehub
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: featurehub-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: featurehub-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: featurehub
      GF_SECURITY_ADMIN_PASSWORD: featurehub
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    
  locust:
    image: locustio/locust:latest
    ports:
      - "8089:8089"
    volumes:
      - ./locust:/mnt/locust
    command: -f /mnt/locust/locustfile.py --host=https://featurestore.onrender.com

  celery-worker:
    build: .
    container_name: featurehub-celery-worker
    command: celery -A materialization worker --loglevel=info
    environment:
      POSTGRES_URL: postgresql://featurehub:featurehub@postgres:5432/featurehub
      REDIS_URL: redis://:featurehub@redis:6379/0
      CELERY_BROKER_URL: redis://:featurehub@redis:6379/1
    depends_on:
      - redis
      - postgres

  celery-beat:
    build: .
    container_name: featurehub-celery-beat
    command: celery -A materialization beat --loglevel=info
    environment:
      POSTGRES_URL: postgresql://featurehub:featurehub@postgres:5432/featurehub
      REDIS_URL: redis://:featurehub@redis:6379/0
      CELERY_BROKER_URL: redis://:featurehub@redis:6379/1
    depends_on:
      - redis
      - postgres

volumes:
  postgres_data:
  grafana_data:
    name: featurestore_grafana_data_v2