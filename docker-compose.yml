services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: featurehub
      POSTGRES_PASSWORD: featurehub
      POSTGRES_DB: featurehub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  redis:
    image: redis:7
    environment:
      REDIS_USERNAME: featurehub
      REDIS_PASSWORD: featurehub
    ports:
      - "6379:6379"
  
volumes:
  postgres_data: